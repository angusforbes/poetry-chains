<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Howe · Emily Dickinson · controls</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
  canvas { display: block; }
  .lil-gui.root { opacity: 0.92; }

  /* transport: faint until the pointer comes near */
  #transport { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 14px;
    padding: 10px 18px 12px; font: 12px/1 ui-monospace, "iA Writer Duospace", monospace; color: #444;
    background: linear-gradient(0deg, rgba(255,255,255,.92), rgba(255,255,255,0)); opacity: .18; transition: opacity .3s; }
  #transport:hover, body.seeking #transport, body.paused-ui #transport { opacity: 1; }
  #transport button { font: 14px/1 ui-monospace, monospace; width: 34px; height: 26px; border: 1px solid #bbb; background: #fff; border-radius: 4px; cursor: pointer; color: #222; }
  #transport label { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  #rate { width: 150px; accent-color: #222; }
  #rlabel { width: 42px; text-align: right; }
  #time { flex: 1; min-width: 200px; accent-color: #222;
    background: linear-gradient(90deg, #ccc var(--seen, 0%), #eee var(--seen, 0%)); height: 4px; border-radius: 2px; appearance: none; }
  #time::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #222; cursor: pointer; }
  #time::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #222; border: 0; cursor: pointer; }
  #tlabel { width: 96px; text-align: right; }
  #seekmsg { display: none; color: #999; }
  body.seeking #seekmsg { display: inline; }
  body.hide-transport #transport { display: none; }
</style>
</head>
<body>
<div id="transport">
  <button id="play" title="pause / play (space)">❚❚</button>
  <label title="playback speed: drag, [ and ] halve/double, 1 resets, double-click resets">speed
    <input id="rate" type="range" min="-4" max="5" step="0.01" value="0"><span id="rlabel">1×</span></label>
  <input id="time" type="range" min="0" max="300000" step="10" value="0" title="time: drag to scrub, ← → 5 s, shift 30 s, Home to start">
  <span id="tlabel">0:00 / 0:00</span>
  <span id="seekmsg">seeking…</span>
</div>
<script>window.PC_CONFIG = { mode: "howe", once: true, controls: true };</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
